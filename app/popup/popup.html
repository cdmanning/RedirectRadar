<!DOCTYPE html>
<html>

<head>
    <title>RedirectRadar</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body class="preload">
    <div class="app-container">
        <header class="navbar">
            <div class="brand">
                <svg class="logo" width="20" height="20" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="64" cy="64" r="55" fill="none" stroke-width="8" />
                    <path d="M64 64 L64 10 A54 54 0 0 1 110 40 Z" />
                </svg>
                <span>RedirectRadar</span>
            </div>
        </header>
        <main class="content">
            <div class="list-item">
                <div class="item-info">
                    <span class="title">URL Monitoring</span>
                    <span class="description">Enable logging of detected URL changes</span>
                </div>
                <label class="status-switch">
                    <input type="checkbox" id="toggleSwitch">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="list-item">
                <div class="log-container" id="logList">
                </div>
            </div>
        </main>
        <footer class="footer-actions">
            <div class="settings-btn" title="Advanced settings coming soon" hidden>
                <svg class="settings-cog" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </div>
            <button id="exportLogs" class="action-btn">Export</button>
            <button id="clearLogs" class="action-btn">Clear</button>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
